name: Scientific and runtime validation
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, thread]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      # TSan's reserved shadow mapping is incompatible with 32-bit mmap entropy
      # on some hosted kernels. This only configures the disposable CI runner.
      - if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBNSIM_SANITIZER=${{ matrix.sanitizer }}
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
